[project]
name = "powerlab"
version = "0.1.0"
description = "Interactive single-line diagram editor and power system analysis tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "PySide6>=6.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
